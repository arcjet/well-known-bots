name: CI validation

on: [push, pull_request, merge_group]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node validate.js --check
      - run: node --test schema.test.js
      - name: Validate bot definitions against the JSON Schema
        run: >-
          npx --yes --package ajv-cli@5.0.0 --package ajv-formats@3.0.1
          ajv validate --spec=draft2020 -c ajv-formats
          -s well-known-bots.schema.json -d well-known-bots.json --all-errors
